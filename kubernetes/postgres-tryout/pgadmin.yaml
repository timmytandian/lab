apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: postgres-tryout
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:9.3.0
        ports:
        - containerPort: 9797
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: pgadmin
  name: pgadmin
  namespace: postgres-tryout
spec:
  selector:
    app.kubernetes.io/name: pgadmin
  ports:
    - protocol: TCP
      port: 9797
      targetPort: 9797
  type: LoadBalancer
